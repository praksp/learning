name: Model Training Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'models/**'
      - 'scripts/train.py'
      - 'scripts/generate_training_data.py'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sun 2am UTC

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate data (if empty or triggered)
        run: |
          if [ ! -f data/products.csv ] || [ $(wc -l < data/products.csv) -lt 100 ]; then
            python scripts/generate_training_data.py
          fi

      - name: Run MLflow training pipeline
        run: |
          python scripts/mlflow_pipeline.py --regenerate-data --skip-feast
        env:
          MLFLOW_TRACKING_URI: ./mlruns

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
